<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anotador · Resúmenes de fútbol</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⚽</span>
    <div>
      <div class="brand-title">Anotador de partidos</div>
      <div class="brand-sub">Revisión del artículo · Multimedia Systems</div>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <a class="tab" href="#goles" data-view="goles" role="tab">
      <span class="tab-icon" aria-hidden="true">🥅</span> Goles <span class="tab-hint">otras ligas</span>
    </a>
    <a class="tab" href="#planos" data-view="planos" role="tab">
      <span class="tab-icon" aria-hidden="true">🎬</span> Planos y juego
    </a>
  </nav>
  <div class="topbar-right">
    <div id="save-status" class="save-status" data-state="saved" title="Estado del guardado">
      <span class="dot"></span><span class="txt">Todo guardado</span>
    </div>
    <button id="help-btn" class="btn btn-ghost" title="Ayuda (tecla ?)">❔ Ayuda</button>
  </div>
</header>

<main id="view" class="view"></main>

<aside id="help-panel" class="help-panel" hidden>
  <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-head">
      <h2 id="help-title">Ayuda</h2>
      <button class="btn btn-ghost" data-close>✕ Cerrar</button>
    </div>
    <div id="help-content" class="help-content"></div>
  </div>
</aside>

<div id="dialog-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/static/common.js"></script>
</body>
</html>
