# Pipeline configuration for high-resolution (1080p) experiments
# Same parameters as default.yaml but with separate results directory

shot_segmentation:
  num_processes: null  # null = use all CPUs

  # Abrupt cuts (Matlab detectAbruptTransitions)
  abrupt_threshold: 0.3
  abrupt_window_size: 15
  abrupt_neighborhood_factor: 0.5

  # Gradual transitions (Matlab detectGradualTransitionsByPeak)
  gradual_filter_window: 15
  gradual_min_peak_height: 0.03
  gradual_min_peak_prominence: 0.02
  gradual_local_threshold_factor: 1.2
  gradual_local_window_ratio: 3
  gradual_min_duration: 15
  gradual_min_distance_from_abrupt: 25
  gradual_min_contrast_factor: 1.0

object_detection:
  model_path: "data/models/best.pt"
  confidence_threshold: 0.5
  frame_step: 5  # process every 5th frame (5fps at 25fps video)

play_classifier:
  play_threshold: 5       # min players for "play"
  smoothing_window: 50     # rolling average window in frames
  min_shot_duration: 4.0   # seconds

ocr_scoreboard:
  num_sample_frames: 200        # frames for IQR variability map
  std_percentile: 8.0           # bottom percentile of IQR → static overlay pixels
  min_region_area: 300          # min pixels for a candidate overlay region
  closing_kernel: [51, 21]      # morphological closing kernel (w, h)
  score_sample_interval: 3.0    # seconds between OCR samples
  score_pattern: "\\d+\\s*[-:]\\s*\\d+"
  majority_window: 5

highlight_assembler:
  min_shot_duration: 4.0
  merge_gap_threshold: 0.5    # seconds
  goal_context_before: 30.0   # seconds before goal
  goal_context_after: 15.0    # seconds after goal

evaluation:
  tolerance_window: 30.0      # seconds for goal matching
  goal_gap_threshold: 30.0    # seconds gap to separate GT events

# Global paths
data_dir: "/mnt/Data-fast/mrt/lf/SoccerNetClip10Videos"
results_dir: "results_hr"
