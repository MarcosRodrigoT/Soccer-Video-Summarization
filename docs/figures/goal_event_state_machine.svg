   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="234.6" y="19.77" transform="rotate(-0 234.6 19.77)">Goal-event detection — multi-stage OCR-reading filter</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0d47a1" x="234.6" y="43.095513" transform="rotate(-0 234.6 43.095513)">Raw OCR readings</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0d47a1; opacity: 0.85" x="234.6" y="54.917469" transform="rotate(-0 234.6 54.917469)">per-frame parsed scores  (home, away)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="89.334575" transform="rotate(-0 234.6 89.334575)">1.  Temporal median filter</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="101.117469" transform="rotate(-0 234.6 101.117469)">window = 15 frames — kills single-frame stat-overlay digits</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="135.534575" transform="rotate(-0 234.6 135.534575)">2.  Cluster concentration filter</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="147.317469" transform="rotate(-0 234.6 147.317469)">remove digit-positions used &lt;20% of the time (clocks)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="181.734575" transform="rotate(-0 234.6 181.734575)">3.  Static-element filter</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="193.517469" transform="rotate(-0 234.6 193.517469)">&gt;90% single non-zero digit + &lt;5% zeros ⇒ branding, discard</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="227.895512" transform="rotate(-0 234.6 227.895512)">4.  Monotonicity enforcement</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="239.717469" transform="rotate(-0 234.6 239.717469)">scores can only increase — clip downward transients</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="274.134575" transform="rotate(-0 234.6 274.134575)">5.  Forward-persistence check</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="285.917469" transform="rotate(-0 234.6 285.917469)">new value must hold ≥ 8 consecutive readings</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100" x="234.6" y="320.295512" transform="rotate(-0 234.6 320.295512)">6.  Max-jump constraint</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e65100; opacity: 0.85" x="234.6" y="332.117469" transform="rotate(-0 234.6 332.117469)">Δ(home + away) ≤ 2 between adjacent score states</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b71c1c" x="234.6" y="366.534575" transform="rotate(-0 234.6 366.534575)">Score-event timeline</text>
   </g>
